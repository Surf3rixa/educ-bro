<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Adventurer's Log | Retro 2014 Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #24221f;
            --panel-bg: rgba(30, 28, 25, 0.92);
            --text-main: #f0ead6;
            --accent-rust: #b84a39;
            --accent-olive: #606d52;
            --border-vintage: 2px dashed #7a705e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.5s ease-in-out;
        }
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 14, 12, 0.75); z-index: -1;
        }
        .wrapper {
            max-width: 1000px; margin: 40px auto; background: var(--panel-bg);
            border: var(--border-vintage); box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            padding: 40px; position: relative;
        }
        header { text-align: center; border-bottom: 2px solid var(--accent-rust); padding-bottom: 25px; margin-bottom: 30px; }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.8rem; letter-spacing: 2px; color: var(--text-main); text-transform: uppercase; }
        .subtitle { font-family: 'Courier Prime', monospace; color: #b5aba0; font-size: 1rem; margin-top: 5px; }
        nav { margin-top: 20px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        nav a {
            font-family: 'Courier Prime', monospace; color: var(--text-main); text-decoration: none;
            text-transform: uppercase; font-size: 0.9rem; padding: 6px 14px; border: 1px solid #7a705e;
            transition: all 0.3s ease;
        }
        nav a:hover { background-color: var(--accent-rust); border-color: var(--accent-rust); }
        section { margin-bottom: 40px; }
        h2 { font-family: 'Playfair Display', serif; font-size: 1.8rem; border-left: 5px solid var(--accent-rust); padding-left: 12px; margin-bottom: 20px; color: var(--text-main); }
        p { font-family: 'Courier Prime', monospace; line-height: 1.6; margin-bottom: 15px; color: #d1c9b8; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: rgba(45, 42, 38, 0.8); border: 1px solid #5e5445; padding: 20px; position: relative; }
        .card h3 { font-family: 'Playfair Display', serif; margin-bottom: 10px; color: var(--text-main); }

        /* Admin UI Trigger Button */
        #admin-trigger {
            position: fixed; bottom: 15px; right: 15px;
            background: rgba(0,0,0,0.85); color: #7a705e; border: 1px solid #7a705e;
            padding: 8px 12px; font-size: 0.8rem; font-family: 'Courier Prime', monospace;
            cursor: pointer; z-index: 999;
        }
        #admin-trigger:hover { color: #f0ead6; border-color: #f0ead6; }

        /* Admin Dashboard Modal */
        #admin-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 1000; overflow-y: auto; padding: 30px;
        }
        .admin-box {
            max-width: 700px; margin: 0 auto; background: #1e1c19;
            border: 2px solid var(--accent-rust); padding: 30px; color: #fff;
        }
        .admin-box h2 { font-family: 'Playfair Display', serif; margin-bottom: 15px; color: #f0ead6; border-left: 5px solid var(--accent-rust); padding-left: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-family: 'Courier Prime', monospace; font-size: 0.85rem; margin-bottom: 5px; color: #b5aba0; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; background: #141311; border: 1px solid #5e5445;
            color: #fff; font-family: 'Courier Prime', monospace; font-size: 0.9rem;
        }
        .btn-ui {
            background: var(--accent-rust); color: #fff; border: none; padding: 10px 20px;
            font-family: 'Courier Prime', monospace; cursor: pointer; font-weight: bold; margin-right: 10px;
        }
        .btn-ui:hover { background: #993b2d; }
        .btn-danger { background: #6b2d24; color: #fff; border: none; padding: 6px 12px; font-family: 'Courier Prime', monospace; cursor: pointer; font-size: 0.8rem; margin-top: 10px; }
        .btn-danger:hover { background: #8a3a2e; }
        .btn-close { background: #444; color: #fff; border: none; padding: 10px 20px; font-family: 'Courier Prime', monospace; cursor: pointer; }
        .edit-section-box { background: #141311; border: 1px solid #3a342c; padding: 15px; margin-bottom: 15px; }
    </style>
</head>
<body id="body-bg">

    <div class="bg-overlay"></div>

    <div class="wrapper">
        <header>
            <h1 id="site-title"></h1>
            <div class="subtitle" id="site-subtitle"></div>
            <nav id="nav-container"></nav>
        </header>
        <main id="content-container"></main>
    </div>

    <!-- UI Editor Trigger -->
    <button id="admin-trigger" onclick="openAdminModal()">⚙️ Open UI Editor</button>

    <!-- Full Visual Manager Modal -->
    <div id="admin-modal">
        <div class="admin-box">
            <h2>🛠️ Master UI Editor</h2>
            <p style="font-size: 0.85rem; margin-bottom: 20px; color: #b5aba0;">Edit literally everything on your portfolio visually below.</p>

            <!-- General Settings -->
            <div class="edit-section-box">
                <h3 style="font-family:'Playfair Display'; margin-bottom:10px; font-size:1.1rem;">General & Theme</h3>
                <div class="form-group">
                    <label>Background Image URL:</label>
                    <input type="text" id="input-bg">
                </div>
                <div class="form-group">
                    <label>Site Main Title:</label>
                    <input type="text" id="input-title">
                </div>
                <div class="form-group">
                    <label>Subtitle / Tagline:</label>
                    <input type="text" id="input-subtitle">
                </div>
            </div>

            <!-- About Section Settings -->
            <div class="edit-section-box">
                <h3 style="font-family:'Playfair Display'; margin-bottom:10px; font-size:1.1rem;">About / Expedition Section</h3>
                <div class="form-group">
                    <label>About Heading Title:</label>
                    <input type="text" id="input-about-title">
                </div>
                <div class="form-group">
                    <label>About Paragraph Text:</label>
                    <textarea id="input-about-text" rows="3"></textarea>
                </div>
            </div>

            <!-- Projects Section Settings -->
            <div class="edit-section-box">
                <h3 style="font-family:'Playfair Display'; margin-bottom:10px; font-size:1.1rem;">Field Work & Projects</h3>
                <div class="form-group">
                    <label>Projects Section Header:</label>
                    <input type="text" id="input-proj-header">
                </div>
                <div id="projects-editor-list"></div>
                <div style="margin-top: 15px; border-top: 1px dashed #444; padding-top: 10px;">
                    <label style="color:#f0ead6; font-weight:bold;">Add New Project:</label>
                    <input type="text" id="new-proj-title" placeholder="Project Name" style="margin-bottom: 6px;">
                    <textarea id="new-proj-desc" placeholder="Project Description" rows="2" style="margin-bottom: 6px;"></textarea>
                    <button class="btn-ui" onclick="addProject()">+ Add Project</button>
                </div>
            </div>

            <!-- Crew Section Settings -->
            <div class="edit-section-box">
                <h3 style="font-family:'Playfair Display'; margin-bottom:10px; font-size:1.1rem;">Expedition Crew (Teammates)</h3>
                <div class="form-group">
                    <label>Crew Section Header:</label>
                    <input type="text" id="input-crew-header">
                </div>
                <div id="crew-editor-list"></div>
                <div style="margin-top: 15px; border-top: 1px dashed #444; padding-top: 10px;">
                    <label style="color:#f0ead6; font-weight:bold;">Add New Teammate:</label>
                    <input type="text" id="new-crew-name" placeholder="Teammate Name" style="margin-bottom: 6px;">
                    <input type="text" id="new-crew-role" placeholder="Role / Expedition Duty" style="margin-bottom: 6px;">
                    <button class="btn-ui" onclick="addCrewMember()">+ Add Teammate</button>
                </div>
            </div>

            <div style="margin-top: 25px; display: flex; gap: 10px;">
                <button class="btn-ui" onclick="saveAllChanges()">Save & Apply Changes</button>
                <button class="btn-close" onclick="closeAdminModal()">Close Editor</button>
            </div>
        </div>
    </div>

    <script>
        // Default Master Data Structure
        const defaultData = {
            title: "The Adventurer's Log",
            subtitle: "Est. 2015 • Explorations & Code",
            bgImage: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80",
            aboutTitle: "The Expedition",
            aboutText: "Welcome to my digital camp. Crafted in the classic 2014-2018 web aesthetic, this space acts as a personal archive for creative builds, code experiments, and long journeys through design.",
            projHeader: "Field Work & Projects",
            projects: [
                { title: "Project Wilder", desc: "A survival wilderness tracker built with classic mid-2010s design patterns." },
                { title: "Atlas Engine", desc: "A lightweight procedural mapping tool for indie creators." }
            ],
            crewHeader: "Expedition Crew",
            crew: [
                { name: "Julian Vance", role: "Lead Cartographer & Dev" },
                { name: "Elena Croft", role: "UI/UX Wilderness Designer" }
            ]
        };

        function getData() {
            const saved = localStorage.getItem('retro_master_portfolio_data');
            return saved ? JSON.parse(saved) : defaultData;
        }

        function saveData(data) {
            localStorage.setItem('retro_master_portfolio_data', JSON.stringify(data));
        }

        // Render everything visually onto the live site
        function renderSite() {
            const data = getData();
            document.body.style.backgroundImage = `url('${data.bgImage}')`;
            document.getElementById('site-title').innerText = data.title;
            document.getElementById('site-subtitle').innerText = data.subtitle;

            let navHTML = `<a href="#about">About</a><a href="#projects">Field Work</a><a href="#team">Crew</a>`;
            let contentHTML = `
                <section id="about">
                    <h2>${data.aboutTitle}</h2>
                    <p>${data.aboutText}</p>
                </section>
                <section id="projects">
                    <h2>${data.projHeader}</h2>
                    <div class="grid-container">
                        ${data.projects.map(p => `<div class="card"><h3>${p.title}</h3><p>${p.desc}</p></div>`).join('')}
                    </div>
                </section>
                <section id="team">
                    <h2>${data.crewHeader}</h2>
                    <div class="grid-container">
                        ${data.crew.map(t => `<div class="card"><h3>${t.name}</h3><p><em>${t.role}</em></p></div>`).join('')}
                    </div>
                </section>
            `;

            document.getElementById('nav-container').innerHTML = navHTML;
            document.getElementById('content-container').innerHTML = contentHTML;
        }

        // Open Modal and populate fields with live data
        function openAdminModal() {
            const data = getData();
            document.getElementById('input-bg').value = data.bgImage;
            document.getElementById('input-title').value = data.title;
            document.getElementById('input-subtitle').value = data.subtitle;
            document.getElementById('input-about-title').value = data.aboutTitle;
            document.getElementById('input-about-text').value = data.aboutText;
            document.getElementById('input-proj-header').value = data.projHeader;
            document.getElementById('input-crew-header').value = data.crewHeader;

            renderEditorLists(data);
            document.getElementById('admin-modal').style.display = 'block';
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        function renderEditorLists(data) {
            // Render Projects inside Editor
            let projContainer = document.getElementById('projects-editor-list');
            projContainer.innerHTML = data.projects.map((p, idx) => `
                <div style="background:#1e1c19; padding:10px; margin-bottom:8px; border:1px solid #444;">
                    <input type="text" id="edit-proj-title-${idx}" value="${p.title}" style="margin-bottom:4px;">
                    <textarea id="edit-proj-desc-${idx}" rows="2" style="margin-bottom:6px;">${p.desc}</textarea>
                    <button class="btn-danger" onclick="deleteProject(${idx})">Delete Project</button>
                </div>
            `).join('');

            // Render Crew inside Editor
            let crewContainer = document.getElementById('crew-editor-list');
            crewContainer.innerHTML = data.crew.map((c, idx) => `
                <div style="background:#1e1c19; padding:10px; margin-bottom:8px; border:1px solid #444;">
                    <input type="text" id="edit-crew-name-${idx}" value="${c.name}" style="margin-bottom:4px;">
                    <input type="text" id="edit-crew-role-${idx}" value="${c.role}" style="margin-bottom:6px;">
                    <button class="btn-danger" onclick="deleteCrewMember(${idx})">Delete Teammate</button>
                </div>
            `).join('');
        }

        function addProject() {
            let title = document.getElementById('new-proj-title').value;
            let desc = document.getElementById('new-proj-desc').value;
            if(!title || !desc) { alert("Please enter project title and description."); return; }

            let data = getData();
            data.projects.push({ title, desc });
            saveData(data);
            
            document.getElementById('new-proj-title').value = '';
            document.getElementById('new-proj-desc').value = '';
            renderEditorLists(data);
        }

        function deleteProject(idx) {
            let data = getData();
            data.projects.splice(idx, 1);
            saveData(data);
            renderEditorLists(data);
        }

        function addCrewMember() {
            let name = document.getElementById('new-crew-name').value;
            let role = document.getElementById('new-crew-role').value;
            if(!name || !role) { alert("Please enter teammate name and role."); return; }

            let data = getData();
            data.crew.push({ name, role });
            saveData(data);
            
            document.getElementById('new-crew-name').value = '';
            document.getElementById('new-crew-role').value = '';
            renderEditorLists(data);
        }

        function deleteCrewMember(idx) {
            let data = getData();
            data.crew.splice(idx, 1);
            saveData(data);
            renderEditorLists(data);
        }

        function saveAllChanges() {
            let data = getData();
            data.bgImage = document.getElementById('input-bg').value;
            data.title = document.getElementById('input-title').value;
            data.subtitle = document.getElementById('input-subtitle').value;
            data.aboutTitle = document.getElementById('input-about-title').value;
            data.aboutText = document.getElementById('input-about-text').value;
            data.projHeader = document.getElementById('input-proj-header').value;
            data.crewHeader = document.getElementById('input-crew-header').value;

            // Gather updated dynamic project edits
            data.projects.forEach((p, idx) => {
                let tElem = document.getElementById(`edit-proj-title-${idx}`);
                let dElem = document.getElementById(`edit-proj-desc-${idx}`);
                if(tElem && dElem) {
                    p.title = tElem.value;
                    p.desc = dElem.value;
                }
            });

            // Gather updated dynamic crew edits
            data.crew.forEach((c, idx) => {
                let nElem = document.getElementById(`edit-crew-name-${idx}`);
                let rElem = document.getElementById(`edit-crew-role-${idx}`);
                if(nElem && rElem) {
                    c.name = nElem.value;
                    c.role = rElem.value;
                }
            });

            saveData(data);
            renderSite();
            closeAdminModal();
            alert("All changes successfully saved and applied!");
        }

        window.onload = renderSite;
    </script>
</body>
</html>
